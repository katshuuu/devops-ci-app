name: CI — verify and publish image
  
on:
  push:   
    branches: [main]  
  pull_request:
    branches: [main]
  workflow_dispatch:
        
permissions: 
  contents: read
          
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
            
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Рекомендую использовать v4, если v7 не работает
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Pylint
        run: python -m pylint app --score=no
        
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt  
            requirements-dev.txt
              
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
        
      - name: Unit tests   
        run: python -m pytest -q
            
  image:
    needs: test
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
              
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
              
      - name: Build image
        run: docker build --tag "devops-ci-app:${GITHUB_SHA}" .
        
      - name: Smoke-test container   
        run: |
          set -euo pipefail
          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}"
          
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done
        
          if [ "$ready" -ne 1 ]; then
            echo "::error::/health did not respond after 15 attempts"
            exit 1
          fi
        
          python3 -m json.tool health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          
          payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
          assert payload == {"status": "ok"}, f"unexpected /health payload: {payload}"
          PY
          docker exec smoke id
      
      - name: Tag registry image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:latest" 
        
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |   
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}" | tee push-sha.log
          docker push "${IMAGE_NAME}:latest" | tee push-latest.log
          grep -E 'digest: sha256:' push-sha.log push-latest.log
      
      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
          
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
        
      - name: Push multi-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # --- ДОБАВЛЕНА ЗАДАЧА ДЕПЛОЯ ---
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Здесь должны быть шаги для деплоя.
      # Например, если используется Ansible, как в вашей лабе:
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts || true

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory/prod.ini site.yml -e "app_image=${IMAGE_NAME}:${GITHUB_SHA}"
